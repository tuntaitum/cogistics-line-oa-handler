<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แบบสอบถามความต้องการเบื้องต้น | Cogistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-frost"></div>
    <div class="header-inner">
      <div class="header-top">
        <div class="logo-area">
          <img src="/logo.png" alt="Cogistics" style="height: 44px; width: auto;" />
        </div>
        <div class="lang-switcher">
          <button class="lang-btn active" onclick="setLang('th')">ไทย</button>
          <button class="lang-btn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('zh')">中文</button>
        </div>
      </div>
      <div>
        <div class="header-title" data-th="แบบสอบถามความต้องการเบื้องต้น" data-en="Initial Requirements Survey" data-zh="初步需求调查表"></div>
        <div class="header-desc" data-th="กรุณากรอกข้อมูลเพื่อให้ทีมงาน Cogistics เข้าใจความต้องการของท่านได้ดียิ่งขึ้น" data-en="Please fill in this form so the Cogistics team can better understand your needs." data-zh="请填写此表格，以便 Cogistics 团队更好地了解您的需求。"></div>
      </div>
    </div>
  </header>

  <!-- PROGRESS BAR -->
  <div class="progress-wrap">
    <div class="progress-inner">
      <div class="progress-steps" id="progressSteps">
        <div class="progress-step">
          <div class="step-dot active" id="dot1">1</div>
          <div class="step-line" id="line1"></div>
        </div>
        <div class="progress-step">
          <div class="step-dot" id="dot2">2</div>
          <div class="step-line" id="line2"></div>
        </div>
        <div class="progress-step">
          <div class="step-dot" id="dot3">3</div>
        </div>
      </div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
  </div>

  <!-- MAIN -->
  <main class="main">
    <div class="form-card" id="formCard">

      <!-- PAGE 1: วัตถุประสงค์ -->
      <div class="page active" id="page1">
        <div class="page-header">
          <div class="page-number" data-th="ขั้นตอนที่ 1 จาก 2" data-en="Step 1 of 2" data-zh="第 1 步，共 2 步"></div>
          <div class="page-title" data-th="วัตถุประสงค์ในการใช้บริการ" data-en="Service Objective" data-zh="服务目的"></div>
        </div>
        <div class="page-body">

          <div class="field" id="f-solution">
            <label class="field-label">
              <span data-th="วัตถุประสงค์หลักของท่าน และสิ่งที่ต้องการให้ Cogistics ช่วยดูแล" data-en="Your main objective and what you need Cogistics to help with" data-zh="您的主要目标以及您需要 Cogistics 帮助的内容"></span><span class="required-star">*</span>
            </label>
            <div class="options">
              <label class="option-item" onclick="selectOption(this, 'solution', 'veggie')">
                <input type="radio" name="solution" value="veggie" />
                <div>
                  <div class="option-label" data-th="🥬 Vegetable Industry Solutions" data-en="🥬 Vegetable Industry Solutions" data-zh="🥬 蔬菜行业解决方案"></div>
                  <div class="option-sub" data-th="การจัดหาวัตถุดิบ ผักผลไม้สด/แช่แข็งเพื่อภาคอุตสาหกรรม" data-en="Sourcing fresh/frozen vegetables and fruits for the industrial sector" data-zh="为工业部门采购新鲜/冷冻蔬菜和水果"></div>
                </div>
              </label>
              <label class="option-item" onclick="selectOption(this, 'solution', 'food')">
                <input type="radio" name="solution" value="food" />
                <div>
                  <div class="option-label" data-th="🚚 Food Pipeline Solutions" data-en="🚚 Food Pipeline Solutions" data-zh="🚚 食品供应链解决方案"></div>
                  <div class="option-sub" data-th="การจัดเก็บและกระจายสินค้าตามโจทย์ของลูกค้า" data-en="Storage and distribution of goods according to client requirements" data-zh="根据客户要求进行货物储存和配送"></div>
                </div>
              </label>
            </div>
            <span class="error-msg" data-th="กรุณาเลือกวัตถุประสงค์" data-en="Please select an objective" data-zh="请选择目标"></span>
          </div>

        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="goNext(1)"><span data-th="ถัดไป" data-en="Next" data-zh="下一步"></span> →</button>
        </div>
      </div>

      <!-- PAGE 2: ข้อมูลการติดต่อ -->
      <div class="page" id="page2">
        <div class="page-header">
          <div class="page-number" data-th="ขั้นตอนที่ 2 จาก 2" data-en="Step 2 of 2" data-zh="第 2 步，共 2 步"></div>
          <div class="page-title" data-th="ข้อมูลการติดต่อ" data-en="Contact Information" data-zh="联系信息"></div>
        </div>
        <div class="page-body">

          <div class="field" id="f-company">
            <label class="field-label" for="company">
              <span data-th="ชื่อบริษัท" data-en="Company Name" data-zh="公司名称"></span><span class="required-star">*</span>
            </label>
            <input type="text" id="company" name="company" />
            <span class="error-msg" data-th="กรุณากรอกชื่อบริษัท" data-en="Please enter your company name" data-zh="请输入公司名称"></span>
          </div>

          <div class="field" id="f-contact">
            <label class="field-label" for="contact">
              <span data-th="ชื่อผู้ติดต่อ และตำแหน่ง" data-en="Contact Name & Position" data-zh="联系人姓名及职位"></span><span class="required-star">*</span>
            </label>
            <input type="text" id="contact" name="contact" />
            <span class="error-msg" data-th="กรุณากรอกชื่อและตำแหน่ง" data-en="Please enter your name and position" data-zh="请输入您的姓名和职位"></span>
          </div>

          <div class="field" id="f-email">
            <label class="field-label" for="email">
              <span data-th="อีเมล" data-en="Email" data-zh="电子邮件"></span>
            </label>
            <input type="email" id="email" name="email" />
            <span class="error-msg" data-th="กรุณากรอกอีเมลที่ถูกต้อง" data-en="Please enter a valid email address" data-zh="请输入有效的电子邮件地址"></span>
          </div>

          <div class="field" id="f-phone">
            <label class="field-label" for="phone">
              <span data-th="เบอร์ติดต่อ" data-en="Phone Number" data-zh="联系电话"></span><span class="required-star">*</span>
            </label>
            <input type="tel" id="phone" name="phone" />
            <span class="error-msg" data-th="กรุณากรอกเบอร์ติดต่อ" data-en="Please enter your phone number" data-zh="请输入您的联系电话"></span>
          </div>


        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="goBack(2)">← <span data-th="ย้อนกลับ" data-en="Back" data-zh="返回"></span></button>
          <button class="btn btn-primary" id="saveContactBtn" onclick="saveContact()">
            <span data-th="ส่งข้อมูลติดต่อ" data-en="Submit contact details" data-zh="提交联系信息"></span>
          </button>
        </div>
      </div>

      <div class="page" id="page7">
        <div class="page-header">
          <div class="page-title" data-th="เราได้รับข้อมูลติดต่อของท่านแล้ว" data-en="We’ve received your contact details" data-zh="我们已收到您的联系信息"></div>
        </div>
        <div class="page-body">
          <p data-th="ทีมงาน Cogistics จะติดต่อกลับ ท่านสามารถเพิ่มรายละเอียดความต้องการได้เลย" data-en="Our team will follow up. You can also tell us more about what you need now." data-zh="Cogistics 团队将与您联系。您也可以现在补充需求详情。"></p>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="showSuccess()" data-th="เสร็จสิ้น" data-en="Done" data-zh="完成"></button>
          <button class="btn btn-primary" onclick="showPage(6)" data-th="เพิ่มรายละเอียดความต้องการ" data-en="Add requirements" data-zh="补充需求"></button>
        </div>
      </div>

      <div class="page" id="page6">
        <div class="page-header">
          <div class="page-number" data-th="ขั้นตอนที่ 1 จาก 3" data-en="Step 1 of 3" data-zh="第 1 步，共 3 步"></div>
          <div class="page-title" data-th="ข้อมูลบริษัทเพิ่มเติม" data-en="Company profile" data-zh="公司简介"></div>
        </div>
        <div class="page-body">
          <div class="field" id="f-market">
            <label class="field-label">
              <span data-th="ตลาดของบริษัทท่าน" data-en="Your company's market" data-zh="贵公司的市场"></span><span class="required-star">*</span>
              <span class="field-desc" style="display:block;margin-top:4px;" data-th="(เลือกได้มากกว่า 1 ข้อ)" data-en="(Select all that apply)" data-zh="（可多选）"></span>
            </label>
            <div class="options">
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="market" value="ร้านสะดวกซื้อ / ห้าง (Convenience Store/Modern Trade)" />
                <div class="option-label" data-th="🏪 ร้านสะดวกซื้อ / ห้าง" data-en="🏪 Convenience Stores / Modern Trades" data-zh="🏪 便利店 / 商超"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="market" value="ร้านอาหารบริการด่วน (Quick Service Restaurant QSR)" />
                <div class="option-label" data-th="🍔 ร้านอาหารบริการด่วน (QSR)" data-en="🍔 Quick Service Restaurant (QSR)" data-zh="🍔 快餐连锁"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="market" value="นำเข้า (Import)" />
                <div class="option-label" data-th="📦 นำเข้า" data-en="📦 Import" data-zh="📦 进口"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="market" value="ส่งออก (Export)" />
                <div class="option-label" data-th="✈️ ส่งออก" data-en="✈️ Export" data-zh="✈️ 出口"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="market" value="ส่งสายการบิน (Air Catering)" />
                <div class="option-label" data-th="✈️ ส่งสายการบิน" data-en="✈️ Air Catering" data-zh="✈️ 航空餐饮"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="market" value="สินค้าออนไลน์ (E-commerce)" />
                <div class="option-label" data-th="🛒 สินค้าออนไลน์" data-en="🛒 E-commerce" data-zh="🛒 电子商务"></div>
              </label>
            </div>
            <span class="error-msg" data-th="กรุณาเลือกตลาดอย่างน้อย 1 ข้อ" data-en="Please select at least one market" data-zh="请至少选择一个市场"></span>
          </div>

          <div class="field" id="f-main-product">
            <label class="field-label" for="mainProduct">
              <span data-th="สินค้าหลักของบริษัทท่าน" data-en="Main product of your company" data-zh="贵公司的主要产品"></span><span class="required-star">*</span>
            </label>
            <input type="text" id="mainProduct" name="mainProduct" />
            <span class="error-msg" data-th="กรุณากรอกสินค้าหลัก" data-en="Please enter your main product" data-zh="请输入主要产品"></span>
          </div>

        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="goBack(6)" data-th="ย้อนกลับ" data-en="Back" data-zh="返回"></button>
          <button class="btn btn-primary" onclick="goNext(6)" data-th="ถัดไป" data-en="Next" data-zh="下一步"></button>
        </div>
      </div>

      <!-- PAGE 3: Vegetable Industry Solutions -->
      <div class="page" id="page3">
        <div class="page-header">
          <div class="page-number" data-th="ขั้นตอนที่ 2 จาก 3" data-en="Step 2 of 3" data-zh="第 2 步，共 3 步"></div>
          <div class="page-title" data-th="ข้อมูลความต้องการ — Vegetable Industry Solutions" data-en="Requirements — Vegetable Industry Solutions" data-zh="需求信息 — 蔬菜行业解决方案"></div>
        </div>
        <div class="page-body">

          <div class="field" id="f-veg-product">
            <label class="field-label" for="vegProduct">
              <span data-th="สินค้าและขนาดของสินค้าที่ท่านกำลังตามหา" data-en="Product and size you are looking for" data-zh="您正在寻找的产品及规格"></span><span class="required-star">*</span>
            </label>
            <div class="field-desc" data-th="เช่น สตรอว์เบอร์รี, ซอสมะเขือเทศ, มะม่วงหั่นเต๋า" data-en="e.g. Strawberry, Tomato sauce, Diced mango" data-zh="例如：草莓、番茄酱、切块芒果"></div>
            <input type="text" id="vegProduct" name="vegProduct" />
            <span class="error-msg" data-th="กรุณากรอกข้อมูลสินค้า" data-en="Please enter product details" data-zh="请输入产品信息"></span>
          </div>

          <div class="field" id="f-veg-endproduct">
            <label class="field-label" for="vegEndProduct">
              <span data-th="สินค้าปลายทางของท่าน (End Product)" data-en="Your end product" data-zh="您的最终产品"></span><span class="required-star">*</span>
            </label>
            <input type="text" id="vegEndProduct" name="vegEndProduct" />
            <span class="error-msg" data-th="กรุณากรอกสินค้าปลายทาง" data-en="Please enter your end product" data-zh="请输入最终产品"></span>
          </div>

          <div class="field" id="f-veg-volume">
            <label class="field-label" for="vegVolume">
              <span data-th="ปริมาณการใช้งาน" data-en="Usage Volume" data-zh="使用量"></span><span class="required-star">*</span>
            </label>
            <input type="text" id="vegVolume" name="vegVolume" />
            <span class="error-msg" data-th="กรุณากรอกปริมาณการใช้งาน" data-en="Please enter usage volume" data-zh="请输入使用量"></span>
          </div>

          <div class="field" id="f-veg-pain">
            <label class="field-label">
              <span data-th="ปัญหาหลักที่ท่านกำลังเผชิญอยู่" data-en="Main challenges you are facing" data-zh="您目前面临的主要挑战"></span>
              <span class="field-desc" style="display:block;margin-top:4px;" data-th="(เลือกได้มากกว่า 1 ข้อ)" data-en="(Select all that apply)" data-zh="（可多选）"></span>
            </label>
            <div class="options">
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="vegPain" value="การพัฒนาสินค้าใหม่ (NPD)" />
                <div class="option-label" data-th="การพัฒนาสินค้าใหม่ (NPD)" data-en="New Product Development (NPD)" data-zh="新产品开发 (NPD)"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="vegPain" value="สินค้าขาดตลาด / ซัพพลายไม่สม่ำเสมอ" />
                <div class="option-label" data-th="สินค้าขาดตลาด / ซัพพลายไม่สม่ำเสมอ" data-en="Supply shortage / Inconsistent supply" data-zh="供应短缺/供应不稳定"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="vegPain" value="ต้องการหาซัพพลายเออร์รายที่สอง" />
                <div class="option-label" data-th="ต้องการหาซัพพลายเออร์รายที่สอง" data-en="Looking for a second supplier" data-zh="寻找第二供应商"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)">
                <input type="checkbox" name="vegPain" value="ปัญหาด้านต้นทุนหรือคุณภาพ" />
                <div class="option-label" data-th="ปัญหาด้านต้นทุนหรือคุณภาพ" data-en="Cost or quality inconsistency" data-zh="成本或质量问题"></div>
              </label>
              <label class="option-item" onclick="toggleCheck(this)" id="veg-other-item">
                <input type="checkbox" name="vegPain" value="other" onchange="toggleOtherInput('vegOtherInput', this)" />
                <div style="flex:1">
                  <div class="option-label" data-th="อื่นๆ" data-en="Other" data-zh="其他"></div>
                  <div class="other-input" id="vegOtherInput">
                    <input type="text" id="vegOtherText" name="vegOtherText" placeholder="" style="margin-top:8px;" />
                  </div>
                </div>
              </label>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="vegDetails">
              <span data-th="โปรดอธิบายเพิ่มเติมปัญหาที่ท่านกำลังเผชิญอยู่" data-en="Please describe your challenges in more detail" data-zh="请详细描述您面临的挑战"></span>
            </label>
            <textarea id="vegDetails" name="vegDetails" rows="4"></textarea>
          </div>

        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="goBack(3)">← <span data-th="ย้อนกลับ" data-en="Back" data-zh="返回"></span></button>
          <button class="btn btn-primary" onclick="goNext(3)"><span data-th="ถัดไป" data-en="Next" data-zh="下一步"></span> →</button>
        </div>
      </div>

      <!-- PAGE 4: Food Pipeline Solutions -->
      <div class="page" id="page4">
        <div class="page-header">
          <div class="page-number" data-th="ขั้นตอนที่ 2 จาก 3" data-en="Step 2 of 3" data-zh="第 2 步，共 3 步"></div>
          <div class="page-title" data-th="ข้อมูลความต้องการ — Food Pipeline Solutions" data-en="Requirements — Food Pipeline Solutions" data-zh="需求信息 — 食品供应链解决方案"></div>
        </div>
        <div class="page-body">

          <div class="field" id="f-food-product">
            <label class="field-label" for="foodProduct">
              <span data-th="สินค้าและขนาดของสินค้าของท่าน" data-en="Your product and its specifications" data-zh="您的产品及规格"></span><span class="required-star">*</span>
            </label>
            <input type="text" id="foodProduct" name="foodProduct" />
            <span class="error-msg" data-th="กรุณากรอกข้อมูลสินค้า" data-en="Please enter product details" data-zh="请输入产品信息"></span>
          </div>

          <div class="field" id="f-food-type">
            <label class="field-label">
              <span data-th="ประเภทของสินค้าของท่าน" data-en="Product type" data-zh="产品类型"></span><span class="required-star">*</span>
            </label>
            <div class="options">
              <label class="option-item" onclick="selectOption(this, 'foodType', 'food')">
                <input type="radio" name="foodType" value="food" />
                <div class="option-label" data-th="🍱 อาหาร" data-en="🍱 Food" data-zh="🍱 食品"></div>
              </label>
              <label class="option-item" onclick="selectOption(this, 'foodType', 'drink')">
                <input type="radio" name="foodType" value="drink" />
                <div class="option-label" data-th="🥤 เครื่องดื่ม" data-en="🥤 Beverage" data-zh="🥤 饮料"></div>
              </label>
              <label class="option-item" onclick="selectOption(this, 'foodType', 'seasoning')">
                <input type="radio" name="foodType" value="seasoning" />
                <div class="option-label" data-th="🧂 เครื่องปรุง" data-en="🧂 Seasoning" data-zh="🧂 调味品"></div>
              </label>
              <label class="option-item" onclick="selectOption(this, 'foodType', 'snack')">
                <input type="radio" name="foodType" value="snack" />
                <div class="option-label" data-th="🍪 ขนม" data-en="🍪 Snack" data-zh="🍪 零食"></div>
              </label>

        <div class="success-desc" data-th="ทีมงาน Cogistics ได้รับข้อมูลของท่านเรียบร้อยแล้ว และจะติดต่อกลับมาโดยเร็วที่สุดค่ะ" data-en="The Cogistics team has received your information and will get back to you as soon as possible." data-zh="Cogistics 团队已收到您的信息，将尽快与您联系。"></div>
        <a href="https://cogistics.co.th" class="btn-website">
          <span data-th="เยี่ยมชมเว็บไซต์ของเรา" data-en="Visit Our Website" data-zh="访问我们的网站"></span> →
        </a>

    <div class="form-footer">
      <span data-th="ข้อมูลของท่านจะถูกเก็บเป็นความลับและใช้เพื่อวัตถุประสงค์ในการให้บริการเท่านั้น" data-en="Your information is confidential and will only be used for service purposes." data-zh="您的信息将保密，仅用于服务目的。"></span>
      <br/>© 2026 Cogistics Co., Ltd.

  </main>

<script>
  // ── STATE ──
  let currentLang = 'th';
  let currentPage = 1;
  let draftToken;
  let contactRequest;
  let selectedSolution = null; // 'veggie' or 'food'

  // ── LINE USER ID from URL ──
  const urlParams = new URLSearchParams(window.location.search);
  const lineUserId = urlParams.get('uid') || '';

  // ── TRANSLATIONS ──
  const T = {
    progressLabels: {
      th: ['วัตถุประสงค์', 'ข้อมูลการติดต่อ', 'ข้อมูลบริษัทเพิ่มเติม', 'ความต้องการ', 'คำถามเพิ่มเติม'],
      en: ['Objective', 'Contact Info', 'Company Profile', 'Requirements', 'Additional'],
      zh: ['目的', '联系信息', '公司简介', '需求', '附加问题'],
    },
    vegOtherPlaceholder: { th: 'โปรดระบุ...', en: 'Please specify...', zh: '请注明...' },
  };

  // ── LANG SWITCHER ──
  function setLang(lang) {
    currentLang = lang;
    document.body.className = lang === 'zh' ? 'lang-zh' : '';
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
    applyLang();
  }

  function applyLang() {
    document.querySelectorAll('[data-th]').forEach(el => {
      el.textContent = el.dataset[currentLang] || el.dataset.th;
    });
    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
      if (el.dataset[currentLang + 'Ph']) el.placeholder = el.dataset[currentLang + 'Ph'];
    });
    // update progress label
    updateProgress();
  }

  // ── PROGRESS ──
  function updateProgress() {
    const stepMap = { 1: 1, 2: 2, 6: 1, 3: 2, 4: 2, 5: 3 };
    const step = stepMap[currentPage];
    document.querySelector('.progress-wrap').hidden = !step;
    if (!step) return;

    const isContactStage = currentPage <= 2;
    const labels = T.progressLabels[currentLang].slice(isContactStage ? 0 : 2);
    document.getElementById('dot3').parentElement.style.display = isContactStage ? 'none' : '';
    document.getElementById('line2').style.display = isContactStage ? 'none' : '';
    for (let i = 1; i <= labels.length; i++) {
      const dot = document.getElementById(`dot${i}`);
      const line = document.getElementById(`line${i}`);
      dot.className = 'step-dot' + (i < step ? ' done' : i === step ? ' active' : '');
      dot.textContent = i < step ? '✓' : i;
      if (line) line.className = 'step-line' + (i < step ? ' done' : '');
    }

    document.getElementById('progressLabel').textContent = labels[step - 1] || '';
  }

  // ── OPTION SELECTION ──
  function selectOption(el, name, value) {
    document.querySelectorAll(`[name="${name}"]`).forEach(input => {
      input.closest('.option-item')?.classList.remove('selected');
    });
    el.classList.add('selected');
    const input = el.querySelector('input');
    if (input) input.checked = true;

    if (name === 'solution') selectedSolution = value;
    clearError(el.closest('.field'));
  }

  function toggleCheck(el) {
    el.classList.toggle('selected', el.querySelector('input').checked);
  }

  function toggleOtherInput(inputId, checkbox) {
    const wrap = document.getElementById(inputId);
    if (!wrap) return;
    if (checkbox && checkbox.checked) {
      wrap.classList.add('visible');
    } else {
      wrap.classList.remove('visible');
    }
  }

  // ── VALIDATION ──
  function clearError(field) {
    if (field) field.classList.remove('has-error');
  }

  function showError(fieldId) {
    const field = document.getElementById(fieldId);
    if (field) field.classList.add('has-error');
  }

  function validatePage(pageNum) {
    let valid = true;

    if (pageNum === 2) {
      ['f-company', 'f-contact', 'f-email', 'f-phone'].forEach(id => {
        const field = document.getElementById(id);
        const input = field?.querySelector('input');
        if (!input?.value.trim()) { showError(id); valid = false; }
        else clearError(field);
      });
      // email format
      const email = document.getElementById('email');
      if (email?.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
        showError('f-email'); valid = false;
      }
    }

    if (pageNum === 1) {
      if (!selectedSolution) { showError('f-solution'); valid = false; }
    }

    if (pageNum === 6) {
      const market = document.getElementById('f-market');
      const product = document.getElementById('f-main-product');
      clearError(market);
      clearError(product);
      if (!document.querySelector('[name="market"]:checked')) {
        showError('f-market'); valid = false;
      }
      if (!document.getElementById('mainProduct').value.trim()) {
        showError('f-main-product'); valid = false;
      }
    }

    if (pageNum === 3) {
      ['f-veg-product', 'f-veg-endproduct', 'f-veg-volume'].forEach(id => {
        const field = document.getElementById(id);
        const input = field?.querySelector('input');
        if (!input?.value.trim()) { showError(id); valid = false; }
        else clearError(field);
      });
    }

    if (pageNum === 4) {
      ['f-food-product', 'f-food-volume', 'f-food-origin', 'f-food-storage-temp', 'f-food-transport-temp'].forEach(id => {
        const field = document.getElementById(id);
        const input = field?.querySelector('input');
        if (!input?.value.trim()) { showError(id); valid = false; }
        else clearError(field);
      });
      if (!document.querySelector('[name="foodType"]:checked')) {
        showError('f-food-type'); valid = false;
      }
      // endpoints validation
      if (!document.querySelector('[name="endpoints"]:checked')) {
        showError('f-food-endpoints'); valid = false;
      }
    }

    if (pageNum === 5) {
      if (!document.querySelector('[name="referral"]:checked')) {
        showError('f-referral'); valid = false;
      }
    }

    return valid;
  }

  // ── NAVIGATION ──
  function goNext(fromPage) {
    if (!validatePage(fromPage)) {
      // scroll to first error
      const firstError = document.querySelector(`#page${fromPage} .has-error`);
      firstError?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    let nextPage;
    if (fromPage === 6) {
      nextPage = selectedSolution === 'veggie' ? 3 : 4;
    } else if (fromPage === 3 || fromPage === 4) {
      nextPage = 5;
    } else {
      nextPage = fromPage + 1;
    }

    showPage(nextPage);
  }

  function goBack(fromPage) {
    let prevPage;
    if (fromPage === 5) {
      prevPage = selectedSolution === 'veggie' ? 3 : 4;
    } else if (fromPage === 3 || fromPage === 4) {
      prevPage = 6;
    } else if (fromPage === 6) {
      prevPage = 7;
    } else {
      prevPage = fromPage - 1;
    }
    showPage(prevPage);
  }

  function showPage(pageNum) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page${pageNum}`)?.classList.add('active');
    currentPage = pageNum;
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── COLLECT FORM DATA ──
  function collectData() {
    const getVal = id => document.getElementById(id)?.value.trim() || '';
    const getChecked = name => Array.from(document.querySelectorAll(`[name="${name}"]:checked`)).map(el => {
      if (el.value === 'other') {
        const otherText = el.closest('.option-item')?.querySelector('input[type="text"]')?.value.trim();
        return otherText ? `อื่นๆ: ${otherText}` : 'อื่นๆ';
      }
      return el.value;
    });

    const solution = selectedSolution;
    const referralVal = document.querySelector('[name="referral"]:checked')?.value || '';
    const referralOther = getVal('referralOtherText');
    const referral = referralVal === 'other' && referralOther ? `อื่นๆ: ${referralOther}` : referralVal;

    const foodTypeVal = document.querySelector('[name="foodType"]:checked')?.value || '';
    const foodTypeOther = getVal('foodTypeOtherText');
    const foodType = foodTypeVal === 'other' && foodTypeOther ? `อื่นๆ: ${foodTypeOther}` : foodTypeVal;

    return {
      lineUserId,
      // Contact details
      company: getVal('company'),
      contact: getVal('contact'),
      email: getVal('email'),
      phone: getVal('phone'),
      // Company profile
      market: getChecked('market').join(', '),
      mainProduct: getVal('mainProduct'),
      // Page 1
      solution,
      // Page 3 (Veggie)
      vegProduct: getVal('vegProduct'),
      vegEndProduct: getVal('vegEndProduct'),
      vegVolume: getVal('vegVolume'),
      vegPainPoints: getChecked('vegPain').join(', '),
      vegDetails: getVal('vegDetails'),
      // Page 4 (Food)
      foodProduct: getVal('foodProduct'),
      foodType,
      foodVolume: getVal('foodVolume'),
      foodOrigin: getVal('foodOrigin'),
      foodStorageTemp: getVal('foodStorageTemp'),
      foodTransportTemp: getVal('foodTransportTemp'),
      foodEndpoints: getChecked('endpoints').join(', '),
      // Page 5
      referral,
      extraInfo: getVal('extraInfo'),
    };
  }

  function showSuccess() {
    showPage(0);
    document.getElementById('successPage').classList.add('active');
  }

  async function saveContact() {
    if (!validatePage(2)) {
      document.querySelector('#page2 .has-error')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    const btn = document.getElementById('saveContactBtn');
    if (btn.disabled) return;
    const back = document.querySelector('#page2 .btn-secondary');
    btn.disabled = back.disabled = true;

    try {
      const { company, contact, email, phone, solution, lineUserId } = collectData();
      const fields = { company, contact, email, phone, solution, lineUserId };
      const fingerprint = JSON.stringify(fields);
      if (contactRequest?.fingerprint !== fingerprint) {
        contactRequest = { fingerprint, requestId: crypto.randomUUID() };
      }
      const response = await fetch('/form/draft/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...fields, requestId: contactRequest.requestId }),
      });
      if (!response.ok) throw new Error('Contact save failed');
      const { token } = await response.json();
      if (!token) throw new Error('Missing confirmation token');
      draftToken = token;
      showPage(7);
    } catch (error) {
      showSaveError(error);
    } finally {
      btn.disabled = back.disabled = false;
    }
  }

  function showSaveError(error) {
    console.error('Save error:', error);
    alert(currentLang === 'th'
      ? 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง'
      : currentLang === 'zh' ? '发生错误，请重试' : 'An error occurred. Please try again.');
  }

  // ── SUBMIT ──
  async function submitForm() {
    if (!validatePage(5)) return;

    const btn = document.getElementById('submitBtn');
    if (!draftToken || btn.disabled) return;
    const back = document.querySelector('#page5 .btn-secondary');
    btn.disabled = back.disabled = true;
    btn.classList.add('loading');

    const data = collectData();

    try {
      const response = await fetch('/form/draft/details', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...data, token: draftToken }),
      });

      if (!response.ok) throw new Error('Server error');

      showSuccess();
    } catch (error) {
      showSaveError(error);
    } finally {
      btn.classList.remove('loading');
      btn.disabled = back.disabled = false;
    }
  }

  // ── INIT ──
  applyLang();
  updateProgress();
</script>
</body>
</html>
